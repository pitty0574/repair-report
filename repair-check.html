<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>整修終檢日報</title>
<!--
  repair-check.html — 整修組 + 終檢組手機輸入介面
  （補漆組繼續使用 repair-report.html）

  寫入方式：與 repair-report.html 相同的 Apps Script Web App（GET + no-cors），
  多帶一個參數 sheet = 「整修階段」或「終檢階段」，由 Apps Script 依此切換分頁（不帶 sheet 則寫入補漆的「整修日報」）。
  寫入欄位：時間戳記 | 記錄日期 | 工號 | 車型 | 部件 | 顏色 | 備註

  ⚠️ no-cors 模式讀不到 Apps Script 的回應，因此 Apps Script 若尚未支援 sheet 參數，
     資料會「看起來上傳成功」但寫到預設（補漆）分頁。上線前請先確認 Apps Script 已修改。

  測試步驟：
  1. 選工站別「整修」→ 輸入工號 8631 → 車型 ZS → 部件 前保 → 顏色 KY → 送出
  2. 確認 Google Sheet「整修階段」分頁多一筆
  3. 關掉網頁重開，所有欄位應該自動帶出剛才的值
  4. 直接按送出，應該能連續送出同樣內容
  5. 切換工站別為「終檢」→ 確認彈窗出現 → 送出 → 確認資料跑到「終檢階段」分頁
  6.（連點測試）快速連按送出多次，Sheet 只應多一筆；按鈕至少鎖 3 秒
  7.（清除測試）按「清除所有自動記憶」→ 確認 → 重開頁面，全部欄位應為空白

  今日完成明細（送出按鈕下方）：
  - 本機 localStorage（key: today_records_YYYYMMDD）每次送出成功立刻 +1
  - 讀 Google Sheet 校正：頁面載入、每 2 分鐘、按「🔄 更新」；筆數不同時以 Sheet 為準
  - 只「讀」Sheet（Sheets API + 公開 API Key），寫入仍走 Apps Script，互不影響
  - ⚠️ 需在下方 SHEET_ID / API_KEY 填入實際值，且試算表需設為「知道連結的人可檢視」；未填時只用本機計數

  今日完成明細測試步驟：
  1. 開啟 repair-check.html
  2. 選整修 / 輸入工號 8631 / 輸入車型 ZS 部件 前保 顏色 KY
  3. 送出 → 下方顯示「總計 1 隻 / ZS: 1 隻」
  4. 連續送出 5 次 → 顯示「總計 6 隻 / ZS: 6 隻」
  5. 改車型為 AQ → 送出 → 顯示「總計 7 隻 / ZS: 6, AQ: 1」
  6. 按「🔄 更新」→ 讀取 Sheet 校正（右上角閃「✓ 已同步」；網路失敗顯示離線模式）
  7. 點「▼ 展開詳細」→ 顯示每筆的時間和內容（最新在上，最多 50 筆）
  8. 改工站別為終檢 → 計數歸零重新讀取終檢階段分頁
  9. 關閉瀏覽器重開 → 當天記錄還在，不會消失（隔天打開自動歸零）

  輸入格式統一 + 送出彈窗 + 最近使用標籤：
  - 工號/車型/顏色去掉所有空白，車型/顏色打字即時轉大寫；部件去頭尾空白，純英文轉大寫、中文保留
  - 黃框只是提醒、仍可送出；未選工站別、欄位空白、工號含非數字 → 送出按鈕變灰並顯示「請完成所有欄位」
  - 送出不再跳確認；成功後彈出綠色卡片 2 秒自動消失，失敗彈出紅色卡片需手動關閉

  測試步驟：
  1. 開啟 repair-check.html
  2. 車型欄位打「zs」→ 應該立刻變成「ZS」
  3. 顏色欄位打「 ky 」→ 送出時變成「KY」（去空白、轉大寫）
  4. 工號打「863」(3 位) → 輸入框變黃色邊框，下方顯示「⚠️ 工號通常 4 位數字」，仍可送出
  5. 車型打「ABCDE」(5 字) → 輸入框變黃色邊框，仍可送出
  6. 工號打「a631」(含字母) → 送出按鈕變灰，顯示「請完成所有欄位」
  7. 車型留空 → 送出按鈕變灰
  8. 所有欄位 OK → 按送出 → 直接送出（不彈確認視窗）
  9. 送出成功 → 彈出綠色卡片顯示剛送的內容（含工站別、工號、車型、部件、顏色、時間）
  10. 2 秒後彈窗自動消失
  11. 送出失敗（可開飛航模式測）→ 彈出紅色卡片，需手動關閉
  12. 送出 1 筆 ZS/KY → 「最近用過」顯示 [ZS] 和 [KY]
  13. 點 [ZS] 標籤 → 車型欄位自動填入 ZS
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --border: #dddbd3;
    --accent: #1a1a1a;
    --accent2: #3d6b4f;
    --text: #1a1a1a;
    --muted: #6b6a66;
    --danger: #b33a2e;
    --success: #2d6b44;
    --repair: #3b82f6;
    --repair-bg: #e8f1fe;
    --check: #10b981;
    --check-bg: #e3f7ef;
    --warn: #f59e0b;
    --station: var(--accent2);
    --input-h: 48px;
    --radius: 10px;
  }
  body {
    font-family: 'Helvetica Neue', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 40px;
  }
  body.st-repair { --station: var(--repair); }
  body.st-check { --station: var(--check); }

  header {
    background: var(--accent);
    color: #fff;
    padding: 16px 20px 14px;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 4px solid var(--station);
  }
  header h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.05em; }
  header p { font-size: 11px; opacity: 0.55; margin-top: 2px; letter-spacing: 0.08em; }

  main { padding: 20px 16px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 16px;
    margin-bottom: 12px;
  }
  .card-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.06em;
    margin-bottom: 6px;
    margin-top: 14px;
  }
  label:first-of-type { margin-top: 0; }
  .label-hint { font-weight: 400; font-size: 11px; color: var(--muted); margin-left: 6px; }

  input[type="text"], input[type="number"], select {
    width: 100%;
    height: var(--input-h);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0 14px;
    font-size: 16px;
    background: var(--bg);
    color: var(--text);
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  input:focus, select:focus { border-color: var(--station); background: #fff; }
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }

  select {
    font-weight: 600;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%;
    background-size: 6px 6px;
    background-repeat: no-repeat;
  }

  .field-row { display: flex; gap: 8px; }
  .field-row input { flex: 1; min-width: 0; }
  .field-clear {
    flex-shrink: 0;
    width: 64px;
    height: var(--input-h);
    font-size: 13px;
    color: var(--muted);
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
  }
  .field-clear:active { background: var(--bg); }

  .station-banner {
    margin-top: 10px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 18px;
    font-weight: 700;
    text-align: center;
    letter-spacing: 0.04em;
    background: #f0eeea;
    color: var(--muted);
  }
  .station-banner.repair { background: var(--repair-bg); color: var(--repair); border: 1.5px solid var(--repair); }
  .station-banner.check { background: var(--check-bg); color: #047857; border: 1.5px solid var(--check); }

  .submit-btn {
    width: 100%;
    height: 64px;
    background: var(--station);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.08em;
    cursor: pointer;
    margin-top: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .submit-btn:disabled { background: #9a9994; cursor: default; }
  .submit-btn .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .submit-btn.loading .spinner { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .forget-btn {
    display: block;
    margin: 28px auto 0;
    background: none;
    border: none;
    color: var(--danger);
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
    padding: 8px;
  }

  .toast {
    position: fixed;
    bottom: 60px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--accent);
    color: #fff;
    padding: 10px 22px;
    border-radius: 24px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transition: all 0.3s;
    z-index: 999;
    max-width: 90%;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--danger); }

  .submit-btn.blocked:disabled { background: #e5e4df; color: #a8a7a1; }
  .submit-hint {
    display: none;
    text-align: center;
    color: var(--danger);
    font-size: 13px;
    margin: 4px 0 6px;
  }
  .submit-hint.show { display: block; }

  /* 非強制警示：黃框 + 小字 */
  input.warn, input.warn:focus { border-color: var(--warn); box-shadow: 0 0 0 1px var(--warn); }
  .field-warn { display: none; font-size: 12px; color: #b45309; margin-top: 5px; }
  .field-warn.show { display: block; }

  /* 最近使用標籤 */
  .recent-tags { display: none; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
  .recent-tags.show { display: flex; }
  .recent-tags .rt-label { font-size: 12px; color: var(--muted); }
  .recent-tags button {
    min-width: 48px;
    height: 36px;
    padding: 0 12px;
    font-size: 15px;
    font-weight: 600;
    background: #ebe9e3;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 18px;
    cursor: pointer;
  }
  .recent-tags button:active { background: #dcd9d1; }

  /* 送出結果彈窗 */
  .result-overlay {
    position: fixed;
    inset: 0;
    z-index: 500;
    background: rgba(0,0,0,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.35s, visibility 0.35s;
  }
  .result-overlay.show { opacity: 1; visibility: visible; }
  .result-card {
    width: 100%;
    max-width: 380px;
    background: #fff;
    border-radius: 16px;
    padding: 26px 22px 18px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.35);
    text-align: center;
    border-top: 6px solid var(--success);
  }
  .result-card.error { border-top-color: var(--danger); }
  .result-title { font-size: 24px; font-weight: 700; color: var(--success); }
  .result-card.error .result-title { color: var(--danger); }
  .result-sub { font-size: 16px; color: var(--muted); margin-top: 10px; }
  .result-list {
    margin: 16px 0 6px;
    padding: 12px 0;
    border-top: 2px solid #eeece6;
    border-bottom: 2px solid #eeece6;
    text-align: left;
    font-size: 17px;
    line-height: 1.9;
  }
  .result-list .k { display: inline-block; width: 4.5em; color: var(--muted); }
  .result-list .v { font-weight: 700; }
  .result-list .v.repair { color: var(--repair); }
  .result-list .v.check { color: #047857; }
  .result-foot { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .result-close {
    margin-top: 16px;
    width: 100%;
    height: 48px;
    font-size: 16px;
    font-weight: 700;
    background: var(--danger);
    color: #fff;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }

  /* ===== 今日完成明細 ===== */
  .today-card {
    position: relative;
    margin-top: 16px;
    border: 2px solid var(--border);
  }
  body.st-repair .today-card { border-color: var(--repair); }
  body.st-check .today-card { border-color: var(--check); }
  .today-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
  .today-title small { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 4px; }
  .sync-status {
    position: absolute;
    top: 12px; right: 14px;
    font-size: 11px;
    color: var(--success);
    opacity: 0;
    transition: opacity 0.3s;
    max-width: 55%;
    text-align: right;
  }
  .sync-status.show { opacity: 1; }
  .sync-status.warn { color: var(--danger); opacity: 1; }
  .today-total { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  .today-total .num {
    font-size: 28px;
    font-weight: 700;
    font-family: 'SF Mono', Menlo, Consolas, monospace;
    color: var(--station);
    margin: 0 4px;
  }
  .today-sub { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .today-table { width: 100%; border-collapse: collapse; font-size: 15px; }
  .today-table td, .today-table th { padding: 7px 4px; border-bottom: 1px solid #eeece6; word-break: break-all; }
  .today-table th { font-size: 12px; color: var(--muted); font-weight: 600; text-align: left; }
  .today-table .r { text-align: right; white-space: nowrap; }
  .mono { font-family: 'SF Mono', Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .today-empty { text-align: center; color: var(--muted); padding: 14px 0 6px; line-height: 1.8; font-size: 14px; }
  .today-actions { display: flex; gap: 8px; margin-top: 14px; }
  .today-actions button {
    flex: 1;
    height: 46px;
    font-size: 14px;
    font-weight: 600;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
  }
  .today-actions button:active { background: #e8e6e0; }
  .today-actions button:disabled { opacity: 0.5; }
  .today-details {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease;
  }
  .today-details.open { max-height: 3000px; }
  .today-details-inner { padding-top: 14px; }
  .today-more { text-align: center; font-size: 12px; color: var(--muted); padding-top: 10px; }
</style>
</head>
<body>

<header>
  <h1>整修 / 終檢日報 <span style="font-weight:400;opacity:0.7;font-size:12px;">Repair &amp; Final Check</span></h1>
  <p>補漆組請使用 repair-report.html</p>
</header>

<main>
  <div class="card">
    <label for="input-station">工站別 / Station<span class="label-hint">切換請重選</span></label>
    <select id="input-station" onchange="onStationChange()">
      <option value="">— 請選擇 / Select —</option>
      <option value="整修">整修 Repair</option>
      <option value="終檢">終檢 Final Check</option>
    </select>
    <div class="station-banner" id="station-banner">請先選擇工站別 / Select station</div>
  </div>

  <div class="card">
    <label for="input-worker">工號 / Employee ID</label>
    <div class="field-row">
      <input type="text" id="input-worker" inputmode="numeric" pattern="[0-9]*" placeholder="工號 / Employee ID" autocomplete="off">
      <button class="field-clear" onclick="clearField('worker')">清除</button>
    </div>
    <div class="field-warn" id="warn-worker"></div>

    <label for="input-model">車型 / Vehicle Model</label>
    <div class="field-row">
      <input type="text" id="input-model" placeholder="例 ZS" autocomplete="off" autocapitalize="characters">
      <button class="field-clear" onclick="clearField('model')">清除</button>
    </div>
    <div class="field-warn" id="warn-model"></div>
    <div class="recent-tags" id="recent-model"></div>

    <label for="input-part">部件 / Part</label>
    <div class="field-row">
      <input type="text" id="input-part" placeholder="例 前保" autocomplete="off">
      <button class="field-clear" onclick="clearField('part')">清除</button>
    </div>
    <div class="field-warn" id="warn-part"></div>

    <label for="input-color">顏色 / Color</label>
    <div class="field-row">
      <input type="text" id="input-color" placeholder="例 KY" autocomplete="off" autocapitalize="characters">
      <button class="field-clear" onclick="clearField('color')">清除</button>
    </div>
    <div class="field-warn" id="warn-color"></div>
    <div class="recent-tags" id="recent-color"></div>
  </div>

  <div class="submit-hint" id="submit-hint">請完成所有欄位 Please fill all fields</div>
  <button class="submit-btn" id="submitBtn" onclick="submitRecord()">
    <div class="spinner"></div>
    <span id="submit-label">送出 Submit</span>
  </button>

  <div class="card today-card" id="today-card">
    <div class="sync-status" id="sync-status"></div>
    <div class="today-title">📊 今日完成明細 <small>Today's Summary</small></div>
    <div id="today-summary"></div>
    <div class="today-details" id="today-details">
      <div class="today-details-inner" id="today-details-inner"></div>
    </div>
    <div class="today-actions">
      <button id="today-refresh" onclick="syncTodayFromSheet(true)">🔄 更新 Refresh</button>
      <button id="today-toggle" onclick="toggleTodayDetails()">▼ 展開詳細 Show Details</button>
    </div>
  </div>

  <button class="forget-btn" onclick="forgetAll()">清除所有自動記憶</button>
</main>

<div class="toast" id="toast"></div>
<div class="result-overlay" id="result-overlay" onclick="if (event.target === this) hideResultModal()">
  <div class="result-card" id="result-card"></div>
</div>

<script>
// 與 repair-report.html 共用同一個 Apps Script Web App
const HARDCODED_URL = 'https://script.google.com/macros/s/AKfycbwVUeAGF_tUtB-fsRGRzGcCL1TWHq9rsjr4eeyGVTJF8i6eZqOMeBQ12dSzEyO90m7wew/exec';

const KEYS = {
  station: 'repair_check_station',
  worker:  'repair_check_worker',
  model:   'repair_check_model',
  part:    'repair_check_part',
  color:   'repair_check_color'
};

const STATIONS = {
  '整修': { sheetName: '整修階段', label: '🏭 您目前是：整修組', cls: 'repair' },
  '終檢': { sheetName: '終檢階段', label: '🔍 您目前是：終檢組', cls: 'check' }
};

const FIELDS = ['worker', 'model', 'part', 'color'];
const LIVE_UPPERCASE_FIELDS = ['model', 'color'];   // 打字時即時轉大寫

function el(id) { return document.getElementById(id); }

function store(key, value) {
  try { value ? localStorage.setItem(key, value) : localStorage.removeItem(key); } catch {}
}
function recall(key) {
  try { return localStorage.getItem(key) || ''; } catch { return ''; }
}

// 目前已確認的工站別（用於切換時判斷是否需要確認彈窗、取消時還原）
let currentStation = '';

function init() {
  const station = recall(KEYS.station);
  if (STATIONS[station]) {
    currentStation = station;
    el('input-station').value = station;
  }
  renderStation();
  FIELDS.forEach(f => {
    const input = el('input-' + f);
    input.value = recall(KEYS[f]);
    input.addEventListener('input', onFieldInput);
  });
  validateForm();
}

function renderStation() {
  const info = STATIONS[currentStation];
  const banner = el('station-banner');
  document.body.classList.remove('st-repair', 'st-check');
  if (info) {
    document.body.classList.add('st-' + info.cls);
    banner.className = 'station-banner ' + info.cls;
    banner.textContent = info.label;
  } else {
    banner.className = 'station-banner';
    banner.textContent = '請先選擇工站別 / Select station';
  }
}

function onStationChange() {
  const sel = el('input-station');
  const next = sel.value;
  if (currentStation && next !== currentStation) {
    const nextName = next ? next + '組' : '未選擇';
    if (!confirm(`確定要從${currentStation}組切換到${nextName}嗎？`)) {
      sel.value = currentStation;
      return;
    }
  }
  currentStation = next;
  store(KEYS.station, next);
  renderStation();
  validateForm();
  onTodayContextChange();
}

function clearField(field) {
  const input = el('input-' + field);
  input.value = '';
  store(KEYS[field], '');
  validateForm();
  input.focus();
}

function forgetAll() {
  if (!confirm('確定要清除所有欄位的記憶？下次打開會變空白。')) return;
  Object.values(KEYS).forEach(k => store(k, ''));
  currentStation = '';
  el('input-station').value = '';
  FIELDS.forEach(f => { el('input-' + f).value = ''; });
  renderStation();
  renderToday();
  validateForm();
  showToast('已清除所有自動記憶');
}

// ===== 輸入格式統一 =====
// 最終送出的格式：工號/車型/顏色去掉所有空白，車型/顏色轉大寫；部件去頭尾空白，純英文才轉大寫（中文保留）
function normalizeField(field, raw) {
  const v = String(raw || '');
  if (field === 'worker') return v.replace(/\s+/g, '');
  if (field === 'model' || field === 'color') return v.replace(/\s+/g, '').toUpperCase();
  if (field === 'part') {
    const t = v.trim();
    return /^[\x20-\x7E]+$/.test(t) ? t.toUpperCase() : t;
  }
  return v.trim();
}

function readField(field) {
  return normalizeField(field, el('input-' + field).value);
}

// 車型、顏色即時轉大寫（保持游標位置；輸入法組字中先不動）
function onFieldInput(e) {
  const input = e.target;
  const field = input.id.replace('input-', '');
  if (LIVE_UPPERCASE_FIELDS.includes(field) && !e.isComposing) {
    const upper = input.value.toUpperCase();
    if (upper !== input.value) {
      const pos = input.selectionStart;
      input.value = upper;
      try { input.setSelectionRange(pos, pos); } catch {}
    }
  }
  validateForm();
}

function setFieldWarn(field, msg) {
  el('input-' + field).classList.toggle('warn', !!msg);
  const w = el('warn-' + field);
  w.textContent = msg || '';
  w.classList.toggle('show', !!msg);
}

let formBlocked = true;

// 黃框只是提醒（仍可送出）；未選工站別、欄位空白、工號含非數字才擋送出
function validateForm() {
  const v = {};
  FIELDS.forEach(f => { v[f] = readField(f); });

  setFieldWarn('worker', /^\d+$/.test(v.worker) && v.worker.length !== 4 ? '⚠️ 工號通常 4 位數字' : '');
  setFieldWarn('model', v.model.length > 4 ? '⚠️ 車型通常不超過 4 字' : '');
  setFieldWarn('color', v.color.length > 4 ? '⚠️ 顏色通常不超過 4 字' : '');

  formBlocked = !STATIONS[currentStation]
    || !v.worker || /\D/.test(v.worker)
    || !v.model || !v.part || !v.color;
  updateSubmitState();
  return !formBlocked;
}

function updateSubmitState() {
  const btn = el('submitBtn');
  btn.disabled = isSubmitting || formBlocked;
  btn.classList.toggle('blocked', !isSubmitting && formBlocked);
  el('submit-hint').classList.toggle('show', !isSubmitting && formBlocked);
}

// 最近使用標籤：取今日明細中出現次數最多的前 5 個，點一下填入
function renderRecentTags(records) {
  ['model', 'color'].forEach(field => {
    const box = el('recent-' + field);
    const counts = {};
    (records || []).forEach(r => { if (r[field]) counts[r[field]] = (counts[r[field]] || 0) + 1; });
    const top = Object.entries(counts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 5);
    box.innerHTML = '';
    box.classList.toggle('show', top.length > 0);
    if (!top.length) return;
    const lbl = document.createElement('span');
    lbl.className = 'rt-label';
    lbl.textContent = '最近用過：';
    box.appendChild(lbl);
    top.forEach(([val]) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = val;
      b.onclick = () => { el('input-' + field).value = val; validateForm(); };
      box.appendChild(b);
    });
  });
}

// ===== 送出 =====

let isSubmitting = false;
const SUBMIT_MIN_LOCK_MS = 3000;   // 從按下起至少鎖 3 秒（Android + 4G 重複觸發）
const SUBMIT_SUCCESS_MS = 2000;    // 成功彈窗與灰色按鈕維持 2 秒

const sleep = ms => new Promise(r => setTimeout(r, ms));

// 送出結果彈窗：成功 2 秒自動淡出（可點外面提前關）；失敗不自動消失，需手動關閉
function showResultModal(ok, rec) {
  const overlay = el('result-overlay');
  const card = el('result-card');
  clearTimeout(overlay._timer);
  card.className = 'result-card' + (ok ? '' : ' error');
  if (ok) {
    const info = STATIONS[rec.station];
    const stationName = rec.station === '整修' ? '整修 Rework' : '終檢 Final Check';
    const row = (k, v, cls) => `<div><span class="k">${k}：</span><span class="v ${cls || ''}">${esc(v)}</span></div>`;
    card.innerHTML =
      '<div class="result-title">✅ 上傳完成 Uploaded</div>' +
      '<div class="result-list">' +
        row('工站別', stationName, info && info.cls) +
        row('工號', rec.worker) + row('車型', rec.model) + row('部件', rec.part) +
        row('顏色', rec.color) + row('時間', rec.time) +
      '</div>' +
      `<div class="result-foot">(${SUBMIT_SUCCESS_MS / 1000} 秒後自動關閉)</div>`;
    overlay._timer = setTimeout(hideResultModal, SUBMIT_SUCCESS_MS);
  } else {
    card.innerHTML =
      '<div class="result-title">❌ 上傳失敗 Failed</div>' +
      '<div class="result-sub">請重試 Please retry</div>' +
      (rec && rec.error ? `<div class="result-foot">${esc(rec.error)}</div>` : '') +
      '<button class="result-close" onclick="hideResultModal()">關閉 Close</button>' +
      '<div class="result-foot">(需手動關閉)</div>';
  }
  overlay.classList.add('show');
}

function hideResultModal() {
  const overlay = el('result-overlay');
  clearTimeout(overlay._timer);
  overlay.classList.remove('show');
}

async function submitRecord() {
  if (isSubmitting) return;

  if (!validateForm()) return;
  const info = STATIONS[currentStation];

  const values = {};
  for (const f of FIELDS) values[f] = readField(f);

  isSubmitting = true;
  hideResultModal();
  const startedAt = Date.now();
  const btn = el('submitBtn');
  const label = el('submit-label');
  updateSubmitState();
  btn.classList.add('loading');
  label.textContent = '上傳中... Uploading...';

  const now = new Date();
  const local = new Date(now.getTime() + 8 * 60 * 60000); // 台灣時間 UTC+8
  const record = {
    sheet: info.sheetName,
    timestamp: now.toISOString(),
    date: local.toISOString().slice(0, 10),
    worker: values.worker,
    model: values.model,
    part: values.part,
    color: values.color,
    note: ''
  };

  let error = '';
  try {
    await uploadToSheets(record);
  } catch (e) {
    error = (e && e.message) || '網路錯誤 Network error';
  }

  btn.classList.remove('loading');

  if (!error) {
    // 成功才寫入記憶，下次打開或下次送出自動帶出
    store(KEYS.station, currentStation);
    FIELDS.forEach(f => store(KEYS[f], values[f]));
    FIELDS.forEach(f => { el('input-' + f).value = values[f]; });
    addTodayRecord(values);

    label.textContent = '✅ 上傳完成 Upload Complete';
    showResultModal(true, { station: currentStation, ...values, time: local.toISOString().slice(11, 19) });
    await sleep(SUBMIT_SUCCESS_MS);
  } else {
    label.textContent = '上傳失敗 Failed';
    showResultModal(false, { error });
  }

  // 無論上傳多快，從按下起至少鎖住 3 秒
  const remaining = SUBMIT_MIN_LOCK_MS - (Date.now() - startedAt);
  if (remaining > 0) await sleep(remaining);

  label.textContent = '送出 Submit';
  isSubmitting = false;
  updateSubmitState();
}

async function uploadToSheets(record) {
  const params = new URLSearchParams(record);
  // no-cors：讀不到回應內容，只有網路層失敗會丟出例外
  await fetch(HARDCODED_URL + '?' + params.toString(), { method: 'GET', mode: 'no-cors' });
}

// ===== 今日完成明細 =====
// 只「讀」Sheet 做校正；寫入仍走上面的 Apps Script。
// TODO: 請補上實際的 Google Sheet ID 與公開 API Key（Google Cloud Console → 憑證 → API 金鑰，限制為 Sheets API）
const SHEET_ID = 'YOUR_SHEET_ID';
const API_KEY = 'YOUR_API_KEY';
const SHEET_CONFIGURED = !SHEET_ID.startsWith('YOUR_') && !API_KEY.startsWith('YOUR_');

const TODAY_PREFIX = 'today_records_';
const TODAY_SYNC_MS = 2 * 60 * 1000;
const TODAY_DETAIL_MAX = 50;

let todayDetailsOpen = false;
let todaySyncSeq = 0;

// 台灣時間（UTC+8）的 Date，用 toISOString() 取出日期/時間字串
function taiwanNow() { return new Date(Date.now() + 8 * 60 * 60000); }
function todayStr() { return taiwanNow().toISOString().slice(0, 10); }
function todayKey() { return TODAY_PREFIX + todayStr().replace(/-/g, ''); }

function todayContext() {
  return { station: currentStation, worker: readField('worker') };
}

// 取得今天、目前工站別 + 工號的記錄；跨日 / 換工站 / 換工號都會歸零
function loadToday() {
  const ctx = todayContext();
  const date = todayStr();
  let data = null;
  try { data = JSON.parse(localStorage.getItem(todayKey()) || 'null'); } catch {}
  if (!data || data.date !== date || data.station !== ctx.station || String(data.worker) !== String(ctx.worker)) {
    data = { station: ctx.station, worker: ctx.worker, date, records: [] };
    saveToday(data);
  }
  return data;
}

function saveToday(data) {
  try {
    // 順便清掉前幾天留下的 key
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i);
      if (k && k.startsWith(TODAY_PREFIX) && k !== todayKey()) localStorage.removeItem(k);
    }
    localStorage.setItem(todayKey(), JSON.stringify(data));
  } catch {}
}

function addTodayRecord(values) {
  const data = loadToday();
  data.records.push({
    time: taiwanNow().toISOString().slice(11, 16),
    model: values.model,
    part: values.part,
    color: values.color
  });
  saveToday(data);
  renderToday();
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function renderToday() {
  const summary = el('today-summary');
  const inner = el('today-details-inner');
  const toggle = el('today-toggle');
  const ctx = todayContext();
  renderRecentTags(ctx.station && ctx.worker ? loadToday().records : []);

  if (!ctx.station || !ctx.worker) {
    summary.innerHTML = '<div class="today-empty">請先選擇工站別並輸入工號<br>Select station and enter Employee ID</div>';
    inner.innerHTML = '';
    toggle.disabled = true;
    return;
  }

  const records = loadToday().records;
  if (!records.length) {
    summary.innerHTML = '<div class="today-empty">今天還沒有記錄 No records yet<br>開始輸入第一筆吧！Start your first record!</div>';
    inner.innerHTML = '';
    toggle.disabled = true;
    return;
  }
  toggle.disabled = false;

  const counts = {};
  records.forEach(r => { counts[r.model] = (counts[r.model] || 0) + 1; });
  const rows = Object.entries(counts)
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
    .map(([m, n]) => `<tr><td>${esc(m)}</td><td class="r mono">${n} 隻</td></tr>`)
    .join('');
  summary.innerHTML =
    `<div class="today-total">總計 Total：<span class="num">${records.length}</span>隻</div>` +
    `<div class="today-sub">依車型 By Model</div>` +
    `<table class="today-table"><tbody>${rows}</tbody></table>`;

  // 依時間倒序（同一分鐘內後送出的在上）
  const sorted = records.map((r, i) => ({ r, i }))
    .sort((a, b) => b.r.time.localeCompare(a.r.time) || b.i - a.i)
    .map(x => x.r);
  const shown = sorted.slice(0, TODAY_DETAIL_MAX);
  const detailRows = shown.map(r =>
    `<tr><td class="mono">${esc(r.time)}</td><td>${esc(r.model)}</td><td>${esc(r.part)}</td><td>${esc(r.color)}</td></tr>`
  ).join('');
  const more = sorted.length - shown.length;
  inner.innerHTML =
    `<table class="today-table"><thead><tr><th>時間</th><th>車型</th><th>部件</th><th>顏色</th></tr></thead><tbody>${detailRows}</tbody></table>` +
    (more > 0 ? `<div class="today-more">...還有 ${more} 筆（請到看板查看）</div>` : '');
}

function toggleTodayDetails() {
  todayDetailsOpen = !todayDetailsOpen;
  el('today-details').classList.toggle('open', todayDetailsOpen);
  el('today-toggle').textContent = todayDetailsOpen ? '▲ 收起詳細 Hide Details' : '▼ 展開詳細 Show Details';
}

function showSyncStatus(msg, warn) {
  const s = el('sync-status');
  clearTimeout(s._timer);
  s.textContent = msg;
  s.className = 'sync-status ' + (warn ? 'warn' : 'show');
  if (!warn) s._timer = setTimeout(() => { s.className = 'sync-status'; }, 1000);
}

// Sheet 的日期可能是 "2026-10-08" 或 "2026/10/8"，統一成 YYYY-MM-DD
function normalizeDate(v) {
  const m = String(v || '').match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/);
  return m ? `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}` : '';
}

// A 欄時間戳記 → 台灣時間 HH:MM（支援 ISO 字串與 Sheet 格式化後的「2026/10/8 下午 3:15:00」）
function timeFromStamp(v) {
  const s = String(v || '');
  if (/^\d{4}-\d{2}-\d{2}T/.test(s)) {
    const d = new Date(s);
    if (!isNaN(d)) return new Date(d.getTime() + 8 * 60 * 60000).toISOString().slice(11, 16);
  }
  const m = s.match(/(\d{1,2}):(\d{2})/);
  if (!m) return '';
  let h = parseInt(m[1], 10);
  if (/下午|PM/i.test(s) && h < 12) h += 12;
  if (/上午|AM/i.test(s) && h === 12) h = 0;
  return String(h).padStart(2, '0') + ':' + m[2];
}

async function syncTodayFromSheet(manual) {
  const ctx = todayContext();
  const info = STATIONS[ctx.station];
  if (!info || !ctx.worker) return;
  if (!SHEET_CONFIGURED) {
    if (manual) showSyncStatus('⚠️ 未設定 Sheet，僅本機計數', true);
    return;
  }
  if (isSubmitting && !manual) return; // 送出中先不校正，避免 Sheet 還沒寫入就被覆蓋

  const seq = ++todaySyncSeq;
  const btn = el('today-refresh');
  btn.disabled = true;
  try {
    const range = encodeURIComponent(`${info.sheetName}!A2:F10000`);
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${range}?key=${API_KEY}`;
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();

    // 期間若切換了工站別 / 工號，或有更新的請求，丟棄這次結果
    const now = todayContext();
    if (seq !== todaySyncSeq || now.station !== ctx.station || now.worker !== ctx.worker) return;

    const today = todayStr();
    const sheetRecords = (json.values || [])
      .filter(row => normalizeDate(row[1]) === today && String(row[2] || '').trim() === String(ctx.worker))
      .map(row => ({
        time: timeFromStamp(row[0]),
        model: String(row[3] || '').trim(),
        part: String(row[4] || '').trim(),
        color: String(row[5] || '').trim()
      }));

    const data = loadToday();
    if (sheetRecords.length !== data.records.length) {
      data.records = sheetRecords;
      saveToday(data);
    }
    renderToday();
    showSyncStatus('✓ 已同步', false);
  } catch (e) {
    if (seq === todaySyncSeq) showSyncStatus('⚠️ 離線模式（本機數字可能不準）', true);
  } finally {
    if (seq === todaySyncSeq) btn.disabled = false;
  }
}

function onTodayContextChange() {
  renderToday();
  syncTodayFromSheet(false);
}

function initToday() {
  el('input-worker').addEventListener('change', onTodayContextChange);
  renderToday();
  syncTodayFromSheet(false);
  setInterval(() => syncTodayFromSheet(false), TODAY_SYNC_MS);
  // 跨日自動歸零：頁面一直開著也會在回到前景時重新整理
  document.addEventListener('visibilitychange', () => { if (!document.hidden) renderToday(); });
}

function showToast(msg, type = '') {
  const t = el('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.className = 'toast'; }, 2500);
}

init();
initToday();
</script>
